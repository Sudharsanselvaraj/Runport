[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runport"
version = "1.0.1"
description = "Universal open-source LLM, prompt, and workflow benchmarking platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Sudharsan Selvaraj", email = "178299750+Sudharsanselvaraj@users.noreply.github.com" }
]
keywords = ["llm", "benchmark", "evaluation", "rag", "agents", "cost"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "python-dotenv>=1.2.4",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/Sudharsanselvaraj/runport"
Repository = "https://github.com/Sudharsanselvaraj/runport"
Issues = "https://github.com/Sudharsanselvaraj/runport/issues"
Changelog = "https://github.com/Sudharsanselvaraj/runport/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Sudharsanselvaraj/runport#readme"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    # Official MCP SDK, used only by tests as an independent client against the Runport MCP server.
    "mcp>=2.3.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]
monitor = [
    "psutil>=5.9.0",
]
report = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "reportlab>=4.0",
    "pypdf>=4.0",
    "pillow>=10.0",
    "tabulate>=0.9.0",
]

[project.scripts]
runport = "runport.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.hatch.build.targets.wheel]
packages = ["src/runport"]
artifacts = [
    "src/runport/_web/**",
    "src/runport/assets/**",
]

[tool.ruff]
line-length = 160
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "web",
    "src/runport/_web",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",
    "E402",
    "F401",
    "F841",
    "E741",
    "E722",
    "W291",
    "W292",
    "W293",
    "F541",
]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_incomplete_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
files = ["src/runport/core", "src/runport/runs", "src/runport/connectors", "src/runport/scorers", "src/runport/workloads", "src/runport/services", "src/runport/traces", "src/runport/sdk.py", "src/runport/mcp_server", "src/runport/rag/target.py", "src/runport/rag/runner.py", "src/runport/classification/runner.py", "src/runport/evaluation/runner.py"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
