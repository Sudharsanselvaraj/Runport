[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runport"
version = "0.1.0"
description = "Universal open-source LLM, prompt, and workflow benchmarking platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Runport Contributors" }
]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
monitor = [
    "psutil>=5.9.0",
]
report = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "reportlab>=4.0",
    "pypdf>=4.0",
    "pillow>=10.0",
    "tabulate>=0.9.0",
]

[project.scripts]
runport = "runport.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.hatch.build.targets.wheel]
packages = ["src/runport"]
