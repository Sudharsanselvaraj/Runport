site_name: Runport
site_url: https://sudharsanselvaraj.github.io/runport/
repo_url: https://github.com/Sudharsanselvaraj/runport
repo_name: Sudharsanselvaraj/runport
site_description: Universal, local-first LLM, prompt, and workflow benchmarking platform under hard spend caps.

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.top

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: quickstart.md
  - Concepts: concepts.md
  - Configuration: config-reference.md
  - Connectors: connectors.md
  - Metrics: metrics.md
  - Safety & Privacy: safety.md
  - Web UI & TUI: web-ui.md
  - CLI Reference: cli.md
  - Specifications:
      - Roadmap Audit: ROADMAP_IMPLEMENTATION_AUDIT.md
      - Universal Execution: UNIVERSAL_EXECUTION_ARCHITECTURE.md
      - Canonical Trace Schema: CANONICAL_TRACE_SCHEMA.md
      - SDK API Contract: SDK_API_CONTRACT.md
      - MCP Architecture: MCP_ARCHITECTURE.md
      - Multi-User Security: MULTI_USER_SECURITY_MODEL.md
      - Roadmap Release Plan: ROADMAP_RELEASE_PLAN.md
  - FAQ: faq.md

exclude_docs: |
  README.md

not_in_nav: |
  ARCHITECTURE.md
  DECISIONS.md
  INVARIANT_TESTS.md
  competitive-positioning.md
  connectors/*
  README.md

