name: Deploy landing page

# Builds the public landing page and the docs portal (web/, `npm run build:site`)
# and publishes them to GitHub Pages at https://<owner>.github.io/Runport/.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # the lockfile was generated on macOS; add Rollup's Linux binary (npm/cli#4828)
      - run: npm install --no-save @rollup/rollup-linux-x64-gnu
      - run: npm test
      - name: Build landing page and docs
        run: npm run build:site
        env:
          LANDING_BASE: /${{ github.event.repository.name }}/
          VITE_SITE_URL: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist-landing

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
