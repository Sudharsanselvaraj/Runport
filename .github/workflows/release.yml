name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Distributions & Web Dashboard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web Dashboard
        working-directory: web
        run: |
          npm ci
          # The lockfile was generated on macOS; add Rollup's Linux binary (npm/cli#4828)
          npm install --no-save @rollup/rollup-linux-x64-gnu
          npm run build
          mkdir -p ../src/runport/_web
          cp -r dist/* ../src/runport/_web/

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build Distributions (sdist and wheel)
        run: uv build

      - name: Upload Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/
          retention-days: 7

  verify:
    name: Verify Wheel Clean Install (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Distribution Artifacts
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist/

      - name: Install Wheel in Isolated Environment
        run: |
          python -m pip install --upgrade pip
          python -c "import glob, subprocess, sys; whl = glob.glob('dist/*.whl')[0]; subprocess.check_call([sys.executable, '-m', 'pip', 'install', whl])"

      - name: Run CLI Smoke Checks
        run: |
          runport --help
          runport --version

      - name: Test Workspace Init
        run: |
          python -c "import subprocess, tempfile, os; d = tempfile.mkdtemp(); subprocess.check_call(['runport', 'init'], cwd=d)"

      - name: Verify Bundled Web Assets
        run: |
          python -c "import runport; from pathlib import Path; p = Path(runport.__file__).parent / '_web' / 'index.html'; assert p.exists(), f'Missing web asset: {p}'; print('Web assets verified.')"

  publish-pypi:
    name: Publish to PyPI (Trusted Publishing)
    needs: [build, verify]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/runport
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing OIDC
      contents: read
    steps:
      - name: Download Distribution Artifacts
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist/

      - name: Publish Package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    name: Create GitHub Release
    needs: [build, verify, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Distribution Artifacts
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist/

      - name: Extract Release Notes & Prerelease Status
        id: release_info
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=${TAG#v}
          echo "Extracting release notes for version $VERSION..."
          python3 -c "
          import os, re
          tag = os.environ.get('TAG', '')
          ver = tag.lstrip('v')
          content = open('CHANGELOG.md').read() if os.path.exists('CHANGELOG.md') else ''
          pattern = r'## \[' + re.escape(ver) + r'\].*?\n(.*?)(?=\n## \[|\Z)'
          match = re.search(pattern, content, re.DOTALL)
          notes = match.group(1).strip() + '\n' if match else f'Release {tag}\n'
          with open('RELEASE_NOTES.md', 'w') as f:
              f.write(notes)

          is_pre = 'true' if re.search(r'[-_\.]?(alpha|beta|rc|dev|preview|a\d|b\d)', tag, re.I) else 'false'
          print(f'is_prerelease={is_pre}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'is_prerelease={is_pre}\n')
          "

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*
          draft: false
          prerelease: ${{ steps.release_info.outputs.is_prerelease == 'true' }}
